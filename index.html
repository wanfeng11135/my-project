<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人介绍 - 任婧博</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a1f44; /* 深蓝色背景 */
            color: #ffffff;            /* 白色文字 */
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 48px;
            max-width: 560px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
        }

        .major {
            font-size: 1.2rem;
            color: #bcd2ff;
            margin-bottom: 32px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }

        .hobbies {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hobbies li {
            background: rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
        }

        .btn {
            margin-top: 32px;
            padding: 12px 32px;
            font-size: 1.1rem;
            color: #0a1f44;
            background-color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #bcd2ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>任婧博</h1>
        <p class="major">专业：软件工程</p>

        <h2>我的爱好</h2>
        <ul class="hobbies">
            <li>🎤 唱歌</li>
            <li>🎨 画画</li>
            <li>🏸 打羽毛球</li>
        </ul>

        <button class="btn" onclick="alert('欢迎！')">点击欢迎</button>
    </div>
</body>
</html>
